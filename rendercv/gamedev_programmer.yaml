cv:
  name: Daniil Fedorov
  photo: ../photo/face1.jpg
  location: Moscow, Russia
  email: adviventes@gmail.com
  phone: '+79208399312'
  headline: Game Developer
  sections:
    summary:
      - Game developer fluent in C++ and C#; experienced in proprietary C++ game engines
        and Unity, with strengths in locomotion, gameplay, animation, and AI systems.
      - Co-founded UwU Novels, raised $19K+ in seed funding, and built its Unity WebGL
        visual-novel engine, growing the platform to 500+ users.
    experience:
      - company: Eagle Dynamics
        position: Engine Programmer
        location: Moscow, Russia
        start_date: 2024-04
        end_date: present
        highlights:
          - Maintained the animation-based locomotion system for NPCs in the simulator's custom engine.
          - Implemented IK algorithms and developed AI systems including decision-making, pathfinding, and obstacle avoidance.
          - Created a dedicated testing submodule and debugging tools for AI development and validation.
      - company: UwU Novels
        position: Co-Founder & Lead Engine Programmer
        location: Moscow, Russia
        start_date: 2024-04
        end_date: 2025-07
        highlights:
          - Leading development of a no-code visual novel platform with a team of 3-5 developers.
          - Built a custom Unity WebGL game engine using MVVM architecture; worked extensively with UniTask, UniRx, DOTween.
          - Integrated with Yandex.Cloud services (S3, OAuth, serverless) and frontend (React.js).
          - Set up CI/CD with Jenkins (local builds) and GitHub Actions (cloud microservices).
          - Raised $19K+ in funding and reached 500+ registered users.
          - Hosted our own game jam with 100 participants and 30 published visual novels.
      - company: Saber Interactive
        position: Junior Gameplay Programmer
        location: Remote
        start_date: 2023-04
        end_date: 2024-04
        highlights:
          - Worked on a first-person title using an in-house game engine and a proprietary scripting language to implement animation-driven gameplay and locomotion.
          - Developed a parkour module and animation-driven interactive props (doors, buttons, ledges).
          - Fixed a critical animation bug deep in the engine core (C++).
          - Wrote integration tests to validate complex animation/gameplay logic.
          - Collaborated closely with QA and animators to polish motion flow and ensure smooth, immersive gameplay.
      - company: Yandex
        position: C++ Backend Programmer
        location: Moscow, Russia
        start_date: 2021-11
        end_date: 2022-04
        highlights:
          - Maintained and extended a high-load C++ backend for the ads engine.
          - Wrote unit tests in Python and SQL queries to validate test results and data integrity.
          - Configured and monitored A/B tests to evaluate feature impact.
    education:
      - institution: Higher School of Economics
        area: System and Software Engineering
        degree: MEng
        start_date: 2024-09
        end_date: 2026-06
      - institution: Higher School of Economics
        area: Software Engineering
        degree: Bachelor
        start_date: 2020-09
        end_date: 2024-07
    technical_skills:
      - label: C++
        details: ImGUI, OpenGL, CMake
      - label: C#
        details: NUnit
      - label: Unity
        details: Zenject, UniTask, UniRx, DOTween
      - label: Architecture
        details: DDD, TDD, ECS, MVVM
      - label: Tools
        details: Figma, Jira, Git, GitHub
      - label: Microservices
        details: Yandex.Cloud, S3, Serverless, Auth
    languages:
      - English (B2)
      - Russian (Native)
      - Belarusian (Native)
    certifications:
      - TOEFL iBT 91/120 (Mar 2024)
